name: Lint

# This repo's entire product is one GitHub Actions workflow file - validating its syntax and
# catching common mistakes (missing quoting, unreachable steps, wrong context access) is directly
# on-mission, not incidental repo hygiene.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: reviewdog/action-actionlint@d290e336d5a743810aef4404f757dc862276d2ae # v1.73.4
        with:
          fail_level: error
